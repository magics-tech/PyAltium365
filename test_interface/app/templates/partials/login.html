<h2>Portal login</h2>
<form hx-post="/login" hx-target="#login-panel" hx-swap="innerHTML">
  <div><label>Username <input name="username" type="text" required autocomplete="username"></label></div>
  <div><label>Password <input name="password" type="password" required autocomplete="current-password"></label></div>
  <button type="submit">Log in</button>
</form>
