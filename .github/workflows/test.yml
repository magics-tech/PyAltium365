name: Test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" -r requirements.txt
      - name: Run unit tests
        run: pytest test_interface/tests tests -m "not integration" -v

  integration:
    runs-on: ubuntu-latest
    if: ${{ secrets.ALTIUM_USER != '' && secrets.ALTIUM_PASS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" -r requirements.txt
      - name: Run integration tests
        env:
          ALTIUM_USER: ${{ secrets.ALTIUM_USER }}
          ALTIUM_PASS: ${{ secrets.ALTIUM_PASS }}
        run: pytest tests/integration -m integration -v
